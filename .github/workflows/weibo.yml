name: 🛒 微博抢购增量监控 V8.3

on:
  schedule:
    - cron: '0,15,30,45 * * * *'   # 示例每 15 min，按你之前加密表改
  workflow_dispatch:

concurrency:
  group: weibo-check
  cancel-in-progress: true

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ① 永远拿到远端最新 HEAD
      - name: 1. 检出并拉到最新
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: git pull --no-rebase origin ${{ github.ref_name }} || true

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests pillow pytz lunardate python-dateutil==2.8.2
          if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi

      - name: 4. Run Weibo Parser
        run: python weibo_parser.py
        env:
          TZ: Asia/Shanghai
          WEIBO_SUB_COOKIE: ${{ secrets.WEIBO_SUB_COOKIE }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}

      - name: 5. 提交最新 ID
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions-bot@users.noreply.github.com"
          if git diff --exit-code last_processed_id.txt; then
            echo "ID 无变化，跳过提交。"
          else
            git add last_processed_id.txt
            git commit -m "🤖 Chore: Update last processed Weibo ID via actions run"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
