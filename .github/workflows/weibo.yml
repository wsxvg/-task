
name: 微博定时检测上新

on:
  schedule:
    # 北京时间11:30开始执行，程序内部等待刃12:00再检测（UTC 03:30）
    - cron: '30 03 * * *'
    # 北京时间15:30开始执行，程序内部等待刃16:00再检测（UTC 07:30）
    - cron: '30 07 * * *'
    # 北京时间17:30开始执行，程序内部等待刃18:00再检测（UTC 09:30）
    - cron: '30 09 * * *'
    # 北京时间18:30开始执行，程序内部等待刃19:00再检测（UTC 10:30）
    - cron: '30 10 * * *'
    # 北京时间21:30开始执行，程序内部等待刃22:00再检测（UTC 13:30）
    - cron: '30 13 * * *'
  workflow_dispatch:

concurrency:
  group: weibo-check
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow pytz lunardate
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run Weibo Parser
      run: |
        python weibo_parser.py
      env:
        TZ: Asia/Shanghai
        WEIBO_SUB_COOKIE: ${{ secrets.WEIBO_SUB_COOKIE }}