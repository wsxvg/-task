name: 🛒 微博抢购增量监控 V8.3 (高频运行版)

on:
  schedule:
    # 🚀 统一高频运行：每 5 分钟运行一次。
    # GitHub Actions cron 使用 UTC 时间。
    - cron: '*/5 * * * *'
    
  workflow_dispatch: # 允许手动运行

concurrency:
  group: weibo-check
  cancel-in-progress: true

permissions:
  contents: write # 确保有提交权限

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. 检出仓库（强制完整同步最新 ID）
        uses: actions/checkout@v4
        with:
          # 确保检出正确的分支
          ref: ${{ github.ref_name }}
          # 强制完整克隆，确保读取到最新的 last_processed_id.txt
          fetch-depth: 0 
          
      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip cache purge 
          pip install --no-cache-dir requests pillow pytz python-dateutil==2.8.2
          if [ -f requirements.txt ]; then
            pip install --no-cache-dir -r requirements.txt
          fi

      - name: 4. Run Weibo Parser
        run: python weibo_parser.py
        env:
          TZ: Asia/Shanghai
          WEIBO_SUB_COOKIE: ${{ secrets.WEIBO_SUB_COOKIE }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}

      - name: 5. 提交最新 ID
        # 仅在 Python 脚本运行成功后执行
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions-bot@users.noreply.github.com"
          
          # 检查文件是否有变化
          if git diff --exit-code last_processed_id.txt; then
            echo "上次 ID 未更新或无变化，无需提交。"
          else
            echo "检测到新的 ID，正在提交文件..."
            git add last_processed_id.txt
            git commit -m "🤖 Chore: Update last processed Weibo ID via actions run"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
