name: 🛒 微博抢购增量监控 V8.2

on:
  schedule:
    # --- 调度优化：移除内部等待，改为更密集、更准点的调度 ---
    
    # 核心监控时间点 (整点 BJT): 12:00, 16:00, 18:00, 19:00, 22:00
    - cron: '0 4 * * *'  # 12:00 BJT
    - cron: '0 8 * * *'  # 16:00 BJT
    - cron: '0 10 * * *' # 18:00 BJT
    - cron: '0 11 * * *' # 19:00 BJT
    - cron: '0 14 * * *' # 22:00 BJT
    
    # 辅助监控时间点 (半点 BJT): 12:30, 16:30, 18:30, 19:30, 22:30
    - cron: '30 4 * * *'
    - cron: '30 8 * * *'
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
    - cron: '30 14 * * *'
    
  workflow_dispatch:

concurrency:
  group: weibo-check
  cancel-in-progress: false

permissions:
  contents: write # 关键：必须设置为 write 才能将 last_processed_id.txt 提交回仓库

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. 检出代码 (包含上次的 ID 文件)
        uses: actions/checkout@v4
        
      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          
      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow pytz lunardate
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: 4. Run Weibo Parser (执行增量抓取和推送)
        run: |
          python weibo_parser.py
        env:
          TZ: Asia/Shanghai
          WEIBO_SUB_COOKIE: ${{ secrets.WEIBO_SUB_COOKIE }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }} 
          
      - name: 5. 💾 持久化最新的 Post ID (增量更新的关键)
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions-bot@users.noreply.github.com"
          
          if git diff --exit-code last_processed_id.txt; then
            echo "上次 ID 未更新或无变化，无需提交。"
          else
            echo "检测到新的 ID，正在提交文件..."
            git add last_processed_id.txt
            git commit -m "🤖 Chore: Update last processed Weibo ID via actions run"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
