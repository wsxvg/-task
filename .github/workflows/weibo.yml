name: 🛒 微博监控与保活 (Debug版)

on:
  schedule:
    - cron: '*/10 * * * *' # 每10分钟一次
  workflow_dispatch:       # 支持手动点击运行

permissions:
  contents: write          # 允许提交代码(保存id)

env:
  TZ: Asia/Shanghai

jobs:
  monitor_task:
    runs-on: ubuntu-latest
    timeout-minutes: 20    # 足够扫码登录的时间

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 3. 安装依赖
        run: |
          pip install requests pytz python-dateutil

      - name: 4. 运行监控脚本
        id: weibo_run
        # 即使出错也继续，因为可能是 Cookie失效导致的退出，我们需要检查 output
        continue-on-error: true 
        env:
          # 必须在 Settings -> Secrets and variables -> Actions 中配置
          WEIBO_SUB_COOKIE: ${{ secrets.WEIBO_SUB_COOKIE }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          python weibo_parser.py

      - name: 5. [关键] 自动更新 Secret (如果有新Cookie)
        if: steps.weibo_run.outputs.NEW_SUB_COOKIE != ''
        env:
          # ⚠️ 这里必须使用 Personal Access Token (PAT)，否则无法更新 Secrets
          GH_TOKEN: ${{ secrets.PA_TOKEN }} 
          NEW_COOKIE: ${{ steps.weibo_run.outputs.NEW_SUB_COOKIE }}
        run: |
          echo "🔄 正在通过 GitHub CLI 更新 Secrets..."
          gh secret set WEIBO_SUB_COOKIE --body "$NEW_COOKIE"
          echo "✅ Secret 更新成功！下次运行将生效。"

      - name: 6. 提交 ID 进度
        if: steps.weibo_run.outcome == 'success'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions-bot@users.noreply.github.com"
          if [ -f last_processed_id.txt ]; then
             git add last_processed_id.txt
             git commit -m "💾 Update processed ID" || echo "无变更"
             git push
          fi
