name: 天气预报机器人推送

on:
  schedule:
    # 北京时间6:45开始执行，程序内部会等待到7:00再发送（UTC 22:45）
    - cron: '45 22 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  weather-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests>=2.31.0 beautifulsoup4>=4.12.0 lxml>=4.9.0 lunardate>=0.2.0
        
    - name: 执行天气推送
      run: python weather-bot-simple.py
      env:
        TZ: Asia/Shanghai
