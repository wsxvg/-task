name: 爱意天气机器人 V3.6 推送

on:
  schedule:
    # 北京时间每天早上6:30执行（UTC 22:30），程序内部等待到7:00执行
    - cron: '30 22 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  weather-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests>=2.31.0 lunardate>=0.2.0 pytz>=2023.3
        
    - name: 执行爱意天气推送
      run: python weather-pro.py
      env:
        TZ: Asia/Shanghai